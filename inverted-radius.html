<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inverted Radius</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0a0a0a;
    font-family: system-ui, sans-serif;
    gap: 3rem;
    flex-wrap: wrap;
    padding: 2rem;
  }

  /* ─── Card 1: original (replicado) ─── */
  .card {
    --r: 20px;
    --s: 30px;
    --x: 20px;
    --y: 10px;

    width: 250px;
    aspect-ratio: 1;
    background: #000;
    border-radius: var(--r);

    --_m: / calc(2 * var(--r)) calc(2 * var(--r)) radial-gradient(#000 70%, #0000 72%);
    --_g: conic-gradient(from 180deg at var(--r) calc(100% - var(--r)), #0000 25%, #000 0);
    --_d: calc(var(--s) + var(--r));

    mask:
      calc(var(--_d) + var(--x)) 100% var(--_m),
      0 calc(100% - var(--_d) - var(--y)) var(--_m),
      radial-gradient(var(--s) at 0 100%, #0000 99%, #000 calc(100% + 1px))
        calc(var(--r) + var(--x)) calc(-1 * var(--r) - var(--y)),
      var(--_g) calc(var(--_d) + var(--x)) 0,
      var(--_g) 0 calc(-1 * var(--_d) - var(--y));
    mask-repeat: no-repeat;
    position: relative;
  }

  .card::after {
    content: "card";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.5);
    font-size: .875rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* ─── Card 2: destaque premium ─── */
  .card-premium {
    --r: 24px;
    --s: 40px;
    --x: 0px;
    --y: 0px;

    width: 280px;
    aspect-ratio: 1;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-radius: var(--r);
    position: relative;
    overflow: hidden;

    --_m: / calc(2 * var(--r)) calc(2 * var(--r)) radial-gradient(#000 70%, #0000 72%);
    --_g: conic-gradient(from 180deg at var(--r) calc(100% - var(--r)), #0000 25%, #000 0);
    --_d: calc(var(--s) + var(--r));

    mask:
      calc(var(--_d) + var(--x)) 100% var(--_m),
      0 calc(100% - var(--_d) - var(--y)) var(--_m),
      radial-gradient(var(--s) at 0 100%, #0000 99%, #000 calc(100% + 1px))
        calc(var(--r) + var(--x)) calc(-1 * var(--r) - var(--y)),
      var(--_g) calc(var(--_d) + var(--x)) 0,
      var(--_g) 0 calc(-1 * var(--_d) - var(--y));
    mask-repeat: no-repeat;
  }

  .card-premium::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 0 100%, rgba(99,102,241,.15), transparent 60%);
    pointer-events: none;
  }

  .card-premium::after {
    content: "premium";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.6);
    font-size: .875rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    font-weight: 500;
    pointer-events: none;
  }

  /* ─── Card 3: gradiente escuro com glow ─── */
  .card-glow {
    --r: 20px;
    --s: 35px;
    --x: 15px;
    --y: 8px;

    width: 250px;
    aspect-ratio: 1;
    background: #000;
    border-radius: var(--r);

    --_m: / calc(2 * var(--r)) calc(2 * var(--r)) radial-gradient(#000 70%, #0000 72%);
    --_g: conic-gradient(from 180deg at var(--r) calc(100% - var(--r)), #0000 25%, #000 0);
    --_d: calc(var(--s) + var(--r));

    mask:
      calc(var(--_d) + var(--x)) 100% var(--_m),
      0 calc(100% - var(--_d) - var(--y)) var(--_m),
      radial-gradient(var(--s) at 0 100%, #0000 99%, #000 calc(100% + 1px))
        calc(var(--r) + var(--x)) calc(-1 * var(--r) - var(--y)),
      var(--_g) calc(var(--_d) + var(--x)) 0,
      var(--_g) 0 calc(-1 * var(--_d) - var(--y));
    mask-repeat: no-repeat;
    position: relative;
  }

  .card-glow::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: inherit;
    background: conic-gradient(from 220deg, #6366f1, #a855f7, #6366f1);
    mask: inherit;
    -webkit-mask: inherit;
    z-index: -1;
    opacity: .6;
    filter: blur(6px);
  }

  .card-glow::after {
    content: "glow";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.5);
    font-size: .875rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* ─── Card 4: corte inferior direito ─── */
  .card-tr {
    --r: 20px;
    --s: 30px;
    --x: 0px;
    --y: 0px;

    width: 250px;
    aspect-ratio: 1;
    background: #111;
    border-radius: var(--r);
    position: relative;

    --_m: / calc(2 * var(--r)) calc(2 * var(--r)) radial-gradient(#000 70%, #0000 72%);
    --_g: conic-gradient(from 0deg at calc(100% - var(--r)) var(--r), #0000 25%, #000 0);
    --_d: calc(var(--s) + var(--r));

    mask:
      100% calc(100% - var(--_d)) var(--_m),
      calc(100% - var(--_d)) 100% var(--_m),
      radial-gradient(var(--s) at 100% 100%, #0000 99%, #000 calc(100% + 1px))
        calc(100% - var(--r)) calc(100% - var(--r)),
      var(--_g) calc(100% - var(--_d)) 100%,
      var(--_g) 100% calc(100% - var(--_d));
    mask-repeat: no-repeat;
  }

  .card-tr::after {
    content: "bottom-right";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.5);
    font-size: .75rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="card"></div>
  <div class="card-premium"></div>
  <div class="card-glow"></div>
  <div class="card-tr"></div>

</body>
</html>
