<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-d15c60b4-2c67-455e-b21a-6d484f882384/styles.css">
<script src="_ds/industry-d15c60b4-2c67-455e-b21a-6d484f882384/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
</helmet>
<article style="display:flex;flex-direction:column;height:100%;background:#ffffff;border:1px solid var(--color-divider);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(29,31,32,.05);transition:box-shadow .2s ease, transform .2s ease;" style-hover="box-shadow:0 10px 26px rgba(29,31,32,.13);transform:translateY(-4px);">

  <div style="position:relative;">
    <div style="aspect-ratio:1/1;background:#f4f4f6;">
      <image-slot id="{{ p.slotId }}" shape="rect" fit="cover" placeholder="Imagem do produto" style="width:100%;height:100%;"></image-slot>
    </div>

    <div style="position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;">
      <sc-if value="{{ p.hasOld }}" hint-placeholder-val="{{ false }}">
        <span style="font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:0.02em;padding:4px 9px;border-radius:999px;background:#e0483f;color:#fff;">{{ p.discountLabel }}</span>
      </sc-if>
      <sc-if value="{{ p.stockBadge }}" hint-placeholder-val="Só 2 un.">
        <span style="font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:0.02em;padding:4px 9px;border-radius:999px;background:#fbe8c6;color:#8a5300;">{{ p.stockBadge }}</span>
      </sc-if>
      <sc-if value="{{ p.conditionBadge }}" hint-placeholder-val="Recondicionado">
        <span style="font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:0.02em;padding:4px 9px;border-radius:999px;background:#e9edf2;color:var(--color-accent-800);">{{ p.conditionBadge }}</span>
      </sc-if>
    </div>

    <button type="button" onClick="{{ p.onWish }}" aria-label="Adicionar aos favoritos" style="position:absolute;top:12px;right:12px;width:36px;height:36px;display:grid;place-items:center;background:#fff;border:1px solid var(--color-divider);border-radius:999px;cursor:pointer;color:var(--color-text);box-shadow:0 1px 3px rgba(29,31,32,.1);transition:transform .15s ease;" style-hover="transform:scale(1.08);">
      <sc-if value="{{ p.wishlisted }}" hint-placeholder-val="{{ false }}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#e0483f" stroke="#e0483f" stroke-width="1.5"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
      </sc-if>
      <sc-if value="{{ p.notWish }}" hint-placeholder-val="{{ true }}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
      </sc-if>
    </button>
  </div>

  <div style="padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;">
    <span style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent);">{{ p.categoryLabel }}</span>
    <h3 style="font-family:var(--font-heading);font-weight:600;font-size:18px;line-height:1.15;letter-spacing:-0.01em;margin:0;">{{ p.name }}</h3>

    <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#e6a817" stroke="#e6a817" stroke-width="1"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2Z"/></svg>
      <span style="font-family:var(--font-heading);font-weight:600;color:var(--color-text);">{{ p.rating }}</span>
      <span>({{ p.reviews }})</span>
      <span style="width:4px;height:4px;border-radius:999px;background:currentColor;margin:0 2px;"></span>
      <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:11px;height:11px;border-radius:999px;border:1px solid var(--color-divider);background:{{ p.colorHex }};"></span>{{ p.color }}</span>
    </div>

    <div style="display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px;">
      <sc-if value="{{ p.hasOld }}" hint-placeholder-val="{{ false }}">
        <span style="font-family:var(--font-heading);font-weight:600;font-size:22px;letter-spacing:0.01em;font-feature-settings:'tnum' 1;color:#c93b33;">{{ p.priceLabel }}</span>
        <span style="font-size:13px;text-decoration:line-through;color:color-mix(in srgb,var(--color-text) 42%,transparent);font-feature-settings:'tnum' 1;">{{ p.oldPriceLabel }}</span>
      </sc-if>
      <sc-if value="{{ p.notOld }}" hint-placeholder-val="{{ true }}">
        <span style="font-family:var(--font-heading);font-weight:600;font-size:22px;letter-spacing:0.01em;font-feature-settings:'tnum' 1;">{{ p.priceLabel }}</span>
      </sc-if>
    </div>

    <button type="button" onClick="{{ p.onAdd }}" style="margin-top:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:10px;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:15px;background:var(--color-accent);color:#fff;border:1px solid var(--color-accent);transition:background .15s ease;" style-hover="background:var(--color-accent-600);">
      <sc-if value="{{ p.notAdded }}" hint-placeholder-val="{{ true }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span>Adicionar</span>
      </sc-if>
      <sc-if value="{{ p.added }}" hint-placeholder-val="{{ false }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg>
        <span>Adicionado</span>
      </sc-if>
    </button>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:430},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Product&quot;}}"></script>
</body>
</html>
